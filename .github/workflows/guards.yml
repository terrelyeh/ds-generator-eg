# Everything CI knows how to check, in two categories.
#
# `checks` is the ordinary floor — types, lint, unit tests. It was missing for
# a long time and the cost showed: `next build` stopped running ESLint in
# Next 16, so a red lint blocked nothing and stayed red.
#
# `guards` is the interesting half: three checks that catch things nothing
# else does.
#
# All three guard against drift that produces NO symptom — the build stays green,
# the screen looks right, and the damage shows up weeks later:
#
#   check:feature-tags   an OpenRouter call with no `feature` still works;
#                        its cost just lands in `unmapped` for ever
#   check:guide-labels   a renamed button leaves the guide describing a tool
#                        that no longer exists
#   check:guide-layouts  a retuned layout colour, or a sixth layout, leaves
#                        the guide illustrating a picker that changed
#
# Running them locally was already possible and that was the problem: a guard
# somebody has to remember to run is a guard for the person who already knew.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Types, lint and the pure-module unit tests. Nothing here needs secrets or
  # a database, so it runs on every PR from anywhere.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types (spechub)
        run: npx tsc --noEmit -p apps/spechub/tsconfig.json

      - name: Types (engenie)
        run: npx tsc --noEmit -p apps/engenie/tsconfig.json

      - name: Lint (spechub)
        run: npm run lint -w spechub

      - name: Lint (engenie)
        run: npm run lint -w engenie

      # Only the pure modules — layout maths, the gap scanner, the spec
      # pairer. See apps/spechub/vitest.config.mts for why the rest is out.
      - name: Unit tests
        run: npm test

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Vercel project's runtime, so a syntax level that
          # builds prod cannot fail here for a reason prod would not hit.
          node-version: 24
          cache: npm

      # check:feature-tags parses TypeScript with the compiler API, so the
      # dependencies are needed. check:guide-labels is node builtins only.
      - run: npm ci

      - name: OpenRouter spend is attributed
        run: npm run check:feature-tags

      - name: The guide still describes the screen
        run: npm run check:guide-labels

      - name: The guide still lists the layouts that exist
        run: npm run check:guide-layouts
